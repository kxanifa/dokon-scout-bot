services:
  - type: web
    name: dokon-scout-bot
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPERADMIN_ID
        value: "1486347042"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TZ
        value: Asia/Tashkent
      - key: NOMINATIM_USER_AGENT
        value: DokonScoutBot/1.0 (contact@dokonscout.uz)
      - key: DEBUG
        value: "0"
