services:
  - type: web
    name: dokon-scout-bot
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SUPERADMIN_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: ADMIN_GROUP_ID
        sync: false
      - key: TZ
        value: Asia/Tashkent
      - key: NOMINATIM_USER_AGENT
        value: DokonScoutBot/1.0 (contact@dokonscout.uz)
      - key: REDIS_URL
        sync: false
      - key: DEBUG
        value: "0"
